(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'a4signoff:' + D.slug + ':' + D.round;
  var st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  st.dec = st.dec || {}; st.notes = st.notes || {};
  var cur = typeof st.cur === 'number' ? st.cur : 0, showLine = true;
  function save() { st.cur = cur; try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  // ---- council-map viewer (pan/zoom) ----
  var viewer = $('viewer'), img = $('img'), vs = { s: 1, x: 0, y: 0 }, nat = { w: 1, h: 1 }, keepView = false;
  function apply() { img.style.transform = 'translate(' + vs.x + 'px,' + vs.y + 'px) scale(' + vs.s + ')'; }
  function fit() { var W = viewer.clientWidth, H = viewer.clientHeight; vs.s = Math.min(W / nat.w, H / nat.h); vs.x = (W - nat.w * vs.s) / 2; vs.y = (H - nat.h * vs.s) / 2; apply(); }
  img.onload = function () { nat = { w: img.naturalWidth, h: img.naturalHeight }; if (!keepView) fit(); keepView = false; };
  viewer.addEventListener('wheel', function (e) {
    e.preventDefault(); var r = viewer.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    var f = e.deltaY < 0 ? 1.15 : 1 / 1.15, ns = Math.max(0.1, Math.min(10, vs.s * f)); f = ns / vs.s;

  }, { passive: false });
  (function () {
    var d = null;

    window.addEventListener('mousemove', function (e) { if (!d) return; vs.x = d.ox + e.clientX - d.x; vs.y = d.oy + e.clientY - d.y; apply(); });
    window.addEventListener('mouseup', function () { d = null; });
  })();
  $('fit').onclick = fit; window.addEventListener('resize', fit);
  function setImg() { var a = D.areas[cur]; img.src = showLine ? a.overlay : a.plain; $('toggle').innerHTML = (showLine ? 'Hide' : 'Show') + ' line <span class="kbd">L</span>'; }
  $('toggle').onclick = function () { showLine = !showLine; keepView = true; setImg(); };
